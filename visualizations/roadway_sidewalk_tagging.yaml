#
# Styled Postpass SQL query for use in Ultra (https://overpass-ultra.us)
type: postpass
# Postpass returns OSM tags as a nested object; flatten them so style filters can read each tag.
transform: |
  export default function (data) {
    for (const feature of data.features) {
      const { tags, ...rest } = feature.properties || {};
      feature.properties = { ...tags, ...rest };
    }
    return data;
  }
style:
  extends: https://styles.trailsta.sh/protomaps-black.json
  layers:
    - type: line
      filter:
        - any
        - [ ==, [ get, 'sidewalk' ], separate ]
        - [ ==, [ get, 'sidewalk:left' ], separate ]
        - [ ==, [ get, 'sidewalk:right' ], separate ]
        - [ ==, [ get, 'sidewalk:both' ], separate ]
      paint: &paint
        line-width: 5
        line-color: "blue"
    - type: line
      filter:
        - any
        - [ ==, [ get, 'sidewalk' ], yes ]
        - [ ==, [ get, 'sidewalk:left' ], yes ]
        - [ ==, [ get, 'sidewalk:right' ], yes ]
        - [ ==, [ get, 'sidewalk:both' ], yes ]
      paint:
        <<: *paint
        line-color: "#F26419"
    - type: line
      filter:
        - any
        - [ ==, [ get, 'sidewalk' ], no ]
        - [ ==, [ get, 'sidewalk:left' ], no ]
        - [ ==, [ get, 'sidewalk:right' ], no ]
        - [ ==, [ get, 'sidewalk:both' ], no ]
      paint:
        <<: *paint
        line-color: "#D81159"
    - type: line
      filter:
        - any
        - [ ==, [ get, 'footway' ], sidewalk ]
      paint:
        line-width: 1
        line-color: "#73D2DE"
    - type: line
      filter:
        - any
        - [ ==, [ get, 'footway' ], traffic_island ]
      paint:
        line-width: 2
        line-color: "#ADC58B"
    - type: line
      filter:
        - any
        - [ ==, [ get, 'footway' ], crossing ]
      paint:
        line-width: 2
        line-color: "#FBB13C"
---
SELECT osm_type, osm_id, tags, geom
FROM postpass_pointlinepolygon
WHERE geom && ST_MakeEnvelope({{wsen}}, 4326)
  AND osm_type = 'W'
  AND (
    tags ? 'footway'
    OR EXISTS (
      SELECT 1
      FROM jsonb_each_text(tags) AS tag
      WHERE tag.key ~ 'sidewalk' AND tag.value ~ 'separate|yes|no'
    )
  )
